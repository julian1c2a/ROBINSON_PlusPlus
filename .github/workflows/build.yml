name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest

    # Todos los `run` se ejecutan desde la raíz de ROBINSON_PlusPlus, que aquí es un
    # SUBDIRECTORIO del workspace (ver el comentario de los dos checkouts).
    # ⚠️ No afecta a los pasos `uses:`: sus rutas siguen siendo relativas al workspace.
    defaults:
      run:
        working-directory: ROBINSON_PlusPlus

    steps:
      # ⚠️ DOS CHECKOUTS, COMO HERMANOS. `lakefile.lean` declara
      #     require FOL from "../FOL"
      # es decir, una dependencia LOCAL, no de git — y a propósito: es la que garantiza
      # que RPP y FOL se compilan SIEMPRE con el mismo toolchain (⛔ nunca `cd FOL &&
      # lake build`). El runner necesita entonces el árbol de FOL al lado.
      #
      # Y como `actions/checkout` no admite un `path:` fuera del workspace, ESTE repo
      # también se clona en un subdirectorio: así `../FOL` cae dentro del workspace.
      #
      # Sin esto el build falla con «FOL: package directory not found». Detectado
      # 2026-09-09, en la primera ejecución real de este workflow.
      - name: Checkout ROBINSON_PlusPlus
        uses: actions/checkout@v4
        with:
          path: ROBINSON_PlusPlus

      - name: Checkout FOL (dependencia local hermana)
        uses: actions/checkout@v4
        with:
          repository: julian1c2a/FOL
          ref: master
          path: FOL

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # ⚠️ Escalar de BLOQUE (`run: |`) a propósito. En una sola línea, el `-d:` de
      # `cut` lleva dos puntos seguidos de espacio y YAML lo interpreta como un mapa:
      # «mapping values are not allowed here», y el workflow ni arranca (falla en 0s
      # con «workflow file issue»). Detectado 2026-09-06 en lean4-project-template.
      - name: Install Lean toolchain
        run: |
          elan toolchain install $(cut -d: -f2 lean-toolchain)

      # ⚠️ Los `path:`/`hashFiles` de un `uses:` NO ven el `working-directory` de arriba:
      # van con el prefijo del subdirectorio.
      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ROBINSON_PlusPlus/.lake/packages
            FOL/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('ROBINSON_PlusPlus/lean-toolchain', 'ROBINSON_PlusPlus/lakefile.lean', 'FOL/lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build
        run: lake build

      - name: Check for sorry
        run: bash check-sorry.bash
        continue-on-error: true   # Warning only — change to false to make it blocking

      # El control de sincronía documentación ↔ código (AI-GUIDE §27). `--quick` omite el
      # `lake build`, que ya se hizo arriba; a cambio el control [A] de jobs no se ejecuta
      # y eso lo dice el propio script (§27.1: un control que no comprueba nada AVISA).
      - name: Check doc sync
        # ⚠️ SIN `--quick` desde el 2026-09-11 (auditoría, F-5): con `--quick` el control [A]
        # NO comprobaba la cifra de jobs, así que el «142 jobs» de los banners no lo verificaba
        # nadie más que una ejecución local. `lake build` ya está cacheado aquí arriba.
        run: bash check-doc-sync.bash

      # ⭐ Anadido el 2026-09-11 (auditoria, F-8): los controles del LIBRO solo corrian a mano,
      # asi que lo IMPRESO podia desviarse del arbol sin que nadie lo notara. Se ejecutan los
      # tres que no necesitan LaTeX; `verificar_pdf.py` queda pendiente (P-1 de PLAN-PRUEBAS.md).
      - name: Set up Python (controles del libro)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Book · extraer fragmentos del arbol
        run: python3 doc/book/scripts/extraer.py
        working-directory: .

      - name: Book · todo \ident{} nombra algo que existe
        run: python3 doc/book/scripts/simbolos.py --estricto

      - name: Book · ningun termino se usa antes de definirse
        run: python3 doc/book/scripts/terminos.py

  # ⭐ P-1 (PLAN-PRUEBAS.md §5): el control §2.1 del libro -- que el codigo IMPRESO en el PDF
  # sea el del repo -- necesita LaTeX, asi que va en su propio job. Solo se dispara cuando
  # cambia el libro: instalar TeX Live cuesta varios minutos y no tiene sentido en cada push.
  libro-pdf:
    name: libro · verificar_pdf (necesita LaTeX)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout ROBINSON_PlusPlus
        uses: actions/checkout@v4

      - name: ¿cambio el libro en este push?
        id: libro
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null | grep -q '^doc/book/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "· sin cambios en doc/book/ — se omite el PDF"
          fi

      - name: Set up Python
        if: steps.libro.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TeX Live
        if: steps.libro.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             latexmk texlive-luatex texlive-xetex texlive-latex-extra             texlive-fonts-recommended texlive-lang-spanish

      - name: Compilar el libro
        if: steps.libro.outputs.run == 'true'
        working-directory: doc/book
        run: |
          python3 scripts/extraer.py
          latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error libro.tex

      - name: El codigo IMPRESO es el del repo (§2.1)
        if: steps.libro.outputs.run == 'true'
        working-directory: doc/book
        run: python3 scripts/verificar_pdf.py
        continue-on-error: true   # Warning only
